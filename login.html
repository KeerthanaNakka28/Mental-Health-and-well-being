<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('logo5.png');
            background-size: 100% auto;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        .login-container {
            width: 400px;
            margin: 100px auto;
            background: linear-gradient(135deg, #e0f7fa, #b2ebf2);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            border: 1px solid #81d4fa;
        }
        input {
            width: calc(100% - 16px);
            padding: 14px;
            margin-top: 20px;
            border: 1px solid #81d4fa;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #29b6f6;
            color: white;
            border: none;
            padding: 14px 25px;
            cursor: pointer;
            margin-top: 25px;
            border-radius: 8px;
            font-size: 18px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #03a9f4;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>User Login</h2>
        <form onsubmit="login(event)">
            <input type="text" id="loginUsername" placeholder="Enter Username" required>
            <input type="password" id="loginPassword" placeholder="Enter Password" required>
            <button type="submit">Login</button>
        </form>
    </div>

    <script>
        function login(event) {
            event.preventDefault();

            const username = document.getElementById("loginUsername").value;
            const password = document.getElementById("loginPassword").value;

            // Retrieve all users stored in localStorage
            const users = Object.keys(localStorage)
                .filter(key => key.startsWith("user_")) // Filtering out only user records
                .map(key => JSON.parse(localStorage.getItem(key))); // Parse and store all user data

            // Find the user object with the matching username
            const user = users.find(user => user.username === username);

            if (user && user.password === password) {
                // Store user in session for profile page access
                localStorage.setItem("loggedInUser", JSON.stringify(user));

                alert("Login successful!");
                window.location.href = "profile.html"; // Redirect to profile page after successful login
            } else {
                alert("Invalid username or password.");
            }
        }
    </script>

</body>
</html>
